<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#c2332c" />
		<title>FireParty</title>
		<script>
			// apply the theme before first paint to avoid a light flash (logic mirrored in src/ui/theme.ts)
			try {
				const stored = localStorage.getItem("fireparty-theme");
				const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "dark" : "light";
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
